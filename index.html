<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商品製造ゲーム（授業内課題）</title>
<style>
body {
  font-family: sans-serif;
  font-size: 18px;
  max-width: 1000px;
  margin: auto;
  padding: 20px;
  background: #f5f5f5;
  color: #222;
}

h1 {
  text-align: center;
  font-size: 28px;
}

.card {
  background: white;
  padding: 18px;
  border-radius: 12px;
  margin-bottom: 15px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

.status-bar {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  background: #eaf4fc;
  border-left: 6px solid #0078d4;
}

.score-badges {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 8px;
}

.badge {
  background: #fff;
  border: 1px solid #bbb;
  border-radius: 6px;
  padding: 4px 10px;
  font-size: 15px;
}

.badge.best {
  background: #fff3cd;
  border-color: #e0a800;
  font-weight: bold;
}

.flow {
  display: flex;
  align-items: center;
  gap: 10px;
}

.section {
  flex: 1;
  text-align: center;
}

table {
  width: 100%;
  border-collapse: collapse;
}

td, th {
  border: 1px solid #ccc;
  padding: 8px;
}

input[type="number"] {
  width: 65px;
  text-align: center;
  font-size: 18px;
  padding: 4px;
}

input[type="text"] {
  font-size: 16px;
  padding: 8px;
  border: 1px solid #bbb;
  border-radius: 6px;
  width: 220px;
  max-width: 100%;
}

button {
  padding: 12px;
  border-radius: 8px;
  border: none;
  background: #0078d4;
  color: white;
  width: 100%;
  margin-top: 8px;
  font-size: 18px;
  cursor: pointer;
}

button:hover:not(:disabled) {
  background: #005fa3;
}

button:disabled {
  background: #999;
  cursor: not-allowed;
}

button.next-btn {
  background: #107c10;
}

button.next-btn:hover:not(:disabled) {
  background: #0b5c0b;
}

button.reset-btn {
  background: #666;
}

button.reset-btn:hover:not(:disabled) {
  background: #444;
}

.highlight {
  font-size: 26px;
  color: #0078d4;
  font-weight: bold;
}

#totalBox {
  text-align: center;
  font-size: 20px;
  font-weight: bold;
}

.arrow {
  text-align: center;
  width: 90px;
}

.arrow-line {
  font-size: 28px;
}

.history-table td, .history-table th {
  border: 1px solid #999;
  padding: 6px;
  font-size: 16px;
  text-align: center;
}

.red {
  background: #ffcccc;
}

.submission-card {
  border: 2px solid #0078d4;
  background: #f9fcff;
}

.student-form {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin: 12px 0;
}

.student-form label {
  display: flex;
  flex-direction: column;
  font-size: 15px;
  font-weight: bold;
  gap: 4px;
}

textarea#submitText {
  width: 100%;
  box-sizing: border-box;
  height: 170px;
  font-family: monospace;
  font-size: 14px;
  padding: 10px;
  border: 1px solid #bbb;
  border-radius: 8px;
  background: #fff;
  margin-top: 8px;
}

.copy-msg {
  color: #107c10;
  font-weight: bold;
  margin-top: 8px;
  min-height: 24px;
  text-align: center;
}

.hidden {
  display: none;
}

@media (max-width: 650px) {
  .flow {
    flex-direction: column;
  }
  .arrow {
    width: auto;
  }
  .arrow-line {
