<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>商品製造ゲーム</title>
<style>

body {
  font-family: sans-serif;
  font-size: 18px;
  max-width: 1000px;
  margin: auto;
  padding: 20px;
  background: #f5f5f5;
}

h1 {
  text-align: center;
  font-size: 28px;
}

.card {
  background: white;
  padding: 18px;
  border-radius: 12px;
  margin-bottom: 15px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

.flow {
  display: flex;
  align-items: center;
  gap: 10px;
}

.section {
  flex: 1;
  text-align: center;
}

table {
  width: 100%;
  border-collapse: collapse;
}

td, th {
  border: 1px solid #ccc;
  padding: 8px;
}

input {
  width: 60px;
  text-align: center;
  font-size: 18px;
}

button {
  padding: 12px;
  border-radius: 8px;
  border: none;
  background: #0078d4;
  color: white;
  width: 100%;
  margin-top: 8px;
  font-size: 18px;
}

.highlight {
  font-size: 26px;
  color: #0078d4;
  font-weight: bold;
}

#totalBox {
  text-align: center;
  font-size: 20px;
  font-weight: bold;
}

.arrow {
  text-align: center;
  width: 120px;
}

.arrow-line {
  font-size: 28px;
}

.history-table td, .history-table th {
  border: 1px solid #999;
  padding: 6px;
  font-size: 16px;
}

.red {
  background: #ffcccc;
}

</style>
</head>

<body>

<h1>商品製造ゲーム</h1>

<div class="card">
今から商品製造ゲームを行います。<br>
材料購入・製造・販売の３部門に人を配置して、「できるだけたくさんの商品を販売する」ゲームです。<br>
配置する人員は４人です。どの部門に何人配置しても（０人でもOKです）。<br>
材料購入 ⇒ 製造 ⇒ 販売 の順でサイコロを振ります。<br>
①〜③を５ターン行ってゲーム終了、販売数を競います。
</div>

<div class="card" id="totalBox">
合計人数：<span id="total">0</span> / 4
</div>

<div class="card">
ターン：<span id="turn">1</span> / 5
</div>

<div class="card">
  <div class="flow">

    <!-- 材料購入 -->
    <div class="section">
      <b>材料購入</b>
      <table>
        <tr><td>人数</td></tr>
        <tr><td><input id="p" value="0" oninput="updateTotal()"></td></tr>
        <tr><td>今回</td></tr>
        <tr><td id="inRaw">-</td></tr>
        <tr><td>原材料</td></tr>
        <tr><td id="raw">0</td></tr>
      </table>
    </div>

    <div class="arrow">
      <div>原材料</div>
      <div class="arrow-line">➡</div>
    </div>

    <!-- 製造 -->
    <div class="section">
      <b>製造</b>
      <table>
        <tr><td>人数</td></tr>
        <tr><td><input id="m" value="0" oninput="updateTotal()"></td></tr>
        <tr><td>今回</td></tr>
        <tr><td id="make">-</td></tr>
        <tr><td>製品</td></tr>
        <tr><td id="product">0</td></tr>
      </table>
    </div>

    <div class="arrow">
      <div>製品</div>
      <div class="arrow-line">➡</div>
    </div>

    <!-- 販売 -->
    <div class="section">
      <b>販売</b>
      <table>
        <tr><td>人数</td></tr>
        <tr><td><input id="s" value="0" oninput="updateTotal()"></td></tr>
        <tr><td>今回</td></tr>
        <tr><td id="sell">-</td></tr>
        <tr><td>累計販売</td></tr>
        <tr><td class="highlight" id="sold">0</td></tr>
      </table>
    </div>

  </div>
</div>

<div class="card">
  <button onclick="play()">サイコロを振る</button>
</div>

<div class="card" id="finalResult">
５ターン終了後に成績が表示されます
</div>

<script>
let raw = 0;
let product = 0;
let sold = 0;
let turn = 1;
const maxTurn = 5;
let history = [];

function updateTotal(){
 const p = +document.getElementById("p").value;
 const m = +document.getElementById("m").value;
 const s = +document.getElementById("s").value;

 const total = p+m+s;
 const el = document.getElementById("total");

 el.innerText = total;
 el.style.color = (total===4)? "black":"red";
}

function dice(n){
 let sum=0;
 for(let i=0;i<n;i++){
  sum += Math.floor(Math.random()*6)+1;
 }
 return sum;
}

function play(){

 if(turn>maxTurn) return;

 const p = +document.getElementById("p").value;
 const m = +document.getElementById("m").value;
 const s = +document.getElementById("s").value;

 if(p+m+s !==4){
  alert("人数の合計は4人にしてください");
  return;
 }

 let inRaw = dice(p);
 raw += inRaw;

 let makeCap = dice(m);
 let make = Math.min(raw, makeCap);
 raw -= make;
 product += make;

 let sellCap = dice(s);
 let sell = Math.min(product, sellCap);
 product -= sell;
 sold += sell;

 history.push({ turn, p, m, s, inRaw, make, sell });

 document.getElementById("inRaw").innerText=inRaw;
 document.getElementById("make").innerText=make;
 document.getElementById("sell").innerText=sell;

 document.getElementById("raw").innerText=raw;
 document.getElementById("product").innerText=product;
 document.getElementById("sold").innerText=sold;

 turn++;
 document.getElementById("turn").innerText=turn;

 if(turn>maxTurn){

  let table = "<table class='history-table'><tr><th>ターン</th><th>配置</th><th>仕入</th><th>製造</th><th>販売</th><th>ボトルネック</th></tr>";

  history.forEach(h=>{

    let min = Math.min(h.inRaw, h.make, h.sell);

    let styleIn = h.inRaw===min ? "class='red'" : "";
    let styleMake = h.make===min ? "class='red'" : "";
    let styleSell = h.sell===min ? "class='red'" : "";

    let bottleneck = [];
    if(h.inRaw===min) bottleneck.push("仕入");
    if(h.make===min) bottleneck.push("製造");
    if(h.sell===min) bottleneck.push("販売");

    table += `
    <tr>
      <td>${h.turn}</td>
      <td>${h.p}/${h.m}/${h.s}</td>
      <td ${styleIn}>${h.inRaw}</td>
      <td ${styleMake}>${h.make}</td>
      <td ${styleSell}>${h.sell}</td>
      <td style="color:red;font-weight:bold;">${bottleneck.join("・")}</td>
    </tr>`;
  });

  table += "</table>";

  document.getElementById("finalResult").innerHTML =
    "🎉 成績：最終販売数 <span class='highlight'>" + sold + "</span><br><br>" +
    "<b>振り返り（ボトルネック分析）</b><br><br>" +
    table +
    "<br><button onclick='location.reload()'>もう一度プレイ</button>";
 }

}

updateTotal();
</script>

</body>
</html>
